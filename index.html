<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>See Tow Bus</title>
    
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@materializecss/materialize@2.3.3/dist/css/materialize.min.css">
    
    <style>
      /* --- Root Core Variables & Reset --- */
      :root {
        --nav-height: 64px;
        --sidebar-width: 300px;
        --bottom-nav-height: 56px;
        --bg-color: #fafafa;
        --surface-color: #ffffff;
        --text-color: #212121;
        --border-color: #e0e0e0;
      }

      body, html {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        overflow: hidden;
        font-family: Aptos, Bierstadt, "San Francisco", "Helvetica Neue", Helvetica;
        background-color: var(--bg-color);
        color: var(--text-color);
      }

      /* --- Automatic CSS Dark Mode Handling --- */
      @media (prefers-color-scheme: dark) {
        :root {
          --bg-color: #121212;
          --surface-color: #1e1e1e;
          --text-color: #f5f5f5;
          --border-color: #333333;
        }
        nav {
          background-color: #1e1e1e !important;
          border-bottom: 1px solid var(--border-color);
        }
        nav .brand-logo, nav .brand-logo i {
          color: #ffffff !important;
        }
        .card, .results-overlay, .desktop-sidebar, .bottom-nav-container, .tab-pane {
          background-color: var(--surface-color) !important;
          color: var(--text-color) !important;
        }
        .tabs {
          background-color: var(--surface-color) !important;
        }
        .tabs .tab a {
          color: rgba(255, 255, 255, 0.7) !important;
        }
        .tabs .tab a.active {
          color: #ffffff !important;
        }
      }

      /* --- Persistent Global Top Bar --- */
      nav {
        height: var(--nav-height);
        line-height: var(--nav-height);
        background-color: #ffffff;
        box-shadow: 0 2px 2px 0 rgba(0,0,0,0.05);
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        z-index: 1000;
      }
      nav .brand-logo {
        color: #212121;
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 1.4rem;
      }

      /* --- App Workspace Container --- */
      .app-workspace {
        position: absolute;
        top: var(--nav-height);
        left: 0;
        width: 100%;
        height: calc(100vh - var(--nav-height));
        display: flex;
      }

      /* --- Desktop Sidebar Layout --- */
      .desktop-sidebar {
        width: var(--sidebar-width);
        height: 100%;
        background-color: #ffffff;
        border-right: 1px solid var(--border-color);
        display: flex;
        flex-direction: column;
        z-index: 10;
      }

      /* --- Primary Interactive Map Base --- */
      #map-canvas {
        flex-grow: 1;
        height: 100%;
        position: relative;
        z-index: 1;
      }

      /* --- Mobile Bottom Navigation Viewport Adjustments --- */
      @media only screen and (max-width: 992px) {
        .app-workspace {
          height: calc(100vh - var(--nav-height) - var(--bottom-nav-height));
        }
        #map-canvas {
          width: 100vw;
        }
      }

      /* --- Mobile Bottom Nav Bar Styling --- */
      .bottom-nav-container {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        height: var(--bottom-nav-height);
        z-index: 1000;
        background-color: #ffffff;
        border-top: 1px solid var(--border-color);
      }
      .bottom-nav-container .tabs {
        height: 100%;
      }
      .bottom-nav-container .tabs .tab a {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        line-height: normal;
        height: 100%;
        padding-top: 4px;
        font-size: 0.75rem;
      }
      .bottom-nav-container .tabs .tab a i {
        margin-bottom: 2px;
        font-size: 1.5rem;
      }

      /* --- Custom Non-Blocking Full Overlay (Sits underneath Top Bar) --- */
      .results-overlay {
        position: fixed;
        top: var(--nav-height);
        left: 0;
        width: 100vw;
        height: calc(100vh - var(--nav-height));
        background-color: #ffffff;
        z-index: 500;
        transform: translateY(100%);
        transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1);
        overflow-y: auto;
        padding: 24px;
      }
      .results-overlay.active {
        transform: translateY(0);
      }
      .close-overlay-btn {
        position: absolute;
        top: 16px;
        right: 16px;
      }
    </style>
  </head>
  <body>

    <header>
      <nav>
        <div class="nav-wrapper container-fluid px-3">
          <a href="#" class="brand-logo">
            <i class="material-icons">directions_bus</i>See Tow Bus
          </a>
        </div>
      </nav>
    </header>

    <main class="app-workspace">
      
      <section class="desktop-sidebar hide-on-med-and-down" id="sidebar-panel">
        <div class="p-3">
          <h5>Navigation</h5>
          <p class="muted-text">Desktop Controls container wrapper</p>
        </div>
      </section>

      <section id="map-canvas">
        </section>

    </main>

    <footer class="bottom-nav-container hide-on-large-only">
      <ul class="tabs tabs-fixed-width transparent">
        <li class="tab">
          <a class="active" href="#map-tab">
            <i class="material-icons">map</i>
            <span>Map</span>
          </a>
        </li>
        <li class="tab">
          <a href="#search-tab">
            <i class="material-icons">search</i>
            <span>Search</span>
          </a>
        </li>
        <li class="tab">
          <a href="#fav-tab">
            <i class="material-icons">star</i>
            <span>Favorites</span>
          </a>
        </li>
      </ul>
    </footer>

    <div id="results-panel" class="results-overlay">
      <button class="btn-floating btn-flat waves-effect close-overlay-btn" id="close-results-btn">
        <i class="material-icons black-text">close</i>
      </button>
      <div class="container">
        <h4>Bus Arrival Timings</h4>
        <hr>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@materializecss/materialize@2.3.3/dist/js/materialize.min.js"></script>
    
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        // Automatically initialize all core Materialize components present
        M.AutoInit();

        // Target references for state manipulation tests
        const resultsPanel = document.getElementById('results-panel');
        const closeResultsBtn = document.getElementById('close-results-btn');

        // Accessible functions to trigger your sweep up display framework natively
        window.showResultsOverlay = () => {
          resultsPanel.classList.add('active');
        };

        window.hideResultsOverlay = () => {
          resultsPanel.classList.remove('active');
        };

        closeResultsBtn.addEventListener('click', window.hideResultsOverlay);
      });
    </script>
  </body>
</html>
