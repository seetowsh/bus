<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>See Tow Bus</title>
    
    <link href="https://fonts.googleapis.com/css?family=Livvic|Nunito+Sans|Material+Icons&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@materializecss/materialize@2.3.3/dist/css/materialize.min.css">
    
    <style>
      /* --- Root Core Variables & Reset --- */
      :root {
        --nav-height: 64px;
        --sidebar-width: 300px;
        --bottom-nav-height: 56px;
        --bg-color: #fafafa;
        --surface-color: #ffffff;
        --text-color: #212121;
        --border-color: #e0e0e0;
        --active-alpha: rgba(0, 0, 0, 0.05);
      }

      body, html {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background-color: var(--bg-color);
        color: var(--text-color);
      }

      /* --- Automatic CSS Dark Mode Handling --- */
      @media (prefers-color-scheme: dark) {
        :root {
          --bg-color: #121212;
          --surface-color: #1e1e1e;
          --text-color: #f5f5f5;
          --border-color: #333333;
          --active-alpha: rgba(255, 255, 255, 0.1);
        }
        nav {
          background-color: #1e1e1e !important;
          border-bottom: 1px solid var(--border-color);
        }
        nav .brand-logo, nav .brand-logo i {
          color: #ffffff !important;
        }
        .card, .results-overlay, .desktop-sidebar, .bottom-nav-container, .view-pane {
          background-color: var(--surface-color) !important;
          color: var(--text-color) !important;
        }
        .collection, .collection-item {
          background-color: var(--surface-color) !important;
          border-color: var(--border-color) !important;
          color: var(--text-color) !important;
        }
        .collection .collection-item.active {
          background-color: var(--active-alpha) !important;
        }
        .collection .collection-item i {
          color: #ffffff !important;
        }
        .tabs {
          background-color: var(--surface-color) !important;
        }
        .tabs .tab a {
          color: rgba(255, 255, 255, 0.7) !important;
        }
        .tabs .tab a.active {
          color: #ffffff !important;
        }
      }

      /* --- Centered Global Top Bar --- */
      nav {
        height: var(--nav-height);
        line-height: var(--nav-height);
        background-color: #ffffff;
        box-shadow: 0 2px 2px 0 rgba(0,0,0,0.05);
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        z-index: 1000;
      }
      nav .nav-wrapper {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100%;
      }
      nav .brand-logo {
        position: relative !important;
        left: auto !important;
        transform: none !important;
        color: #212121;
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 1.4rem;
      }

      /* --- App Workspace Layout --- */
      .app-workspace {
        position: absolute;
        top: var(--nav-height);
        left: 0;
        width: 100%;
        height: calc(100vh - var(--nav-height));
        display: flex;
      }

      /* --- Desktop Sidebar Layout --- */
      .desktop-sidebar {
        width: var(--sidebar-width);
        height: 100%;
        background-color: #ffffff;
        border-right: 1px solid var(--border-color);
        z-index: 10;
      }
      .sidebar-nav-menu {
        border: none !important;
        margin: 0;
      }
      .sidebar-nav-menu .collection-item {
        display: flex;
        align-items: center;
        gap: 16px;
        padding: 20px;
        font-size: 1.1rem;
        color: var(--text-color);
        cursor: pointer;
        transition: background-color 0.2s ease;
      }
      .sidebar-nav-menu .collection-item:hover {
        background-color: var(--active-alpha);
      }
/* --- Align Desktop Sidebar with Modern MD3 Tokens --- */
.sidebar-nav-menu .collection-item.active {
  /* Match the primary theme color the button is pulling */
  background-color: var(--md-sys-color-primary) !important;
  /* Automatically use the mathematically correct high-contrast text color */
  color: var(--md-sys-color-on-primary) !important;
  font-weight: 600;
}

/* Force the icon inside the active sidebar item to adapt as well */
.sidebar-nav-menu .collection-item.active i {
  color: var(--md-sys-color-on-primary) !important;
}

/* Create a modern, dynamic hover state using the primary color at 10% opacity */
.sidebar-nav-menu .collection-item:hover {
  background-color: color-mix(in srgb, var(--md-sys-color-primary) 10%, transparent) !important;
  color: var(--md-sys-color-primary) !important;
}
.sidebar-nav-menu .collection-item:hover i {
  color: var(--md-sys-color-primary) !important;
}

      /* --- Central Split Screen Workspaces --- */
      .content-container {
        flex-grow: 1;
        height: 100%;
        position: relative;
      }

      /* --- Universal Tab View Panes --- */
      .view-pane {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s ease-in-out;
        background-color: var(--bg-color);
      }
      .view-pane.active {
        opacity: 1;
        pointer-events: auto;
        z-index: 2;
      }
      #map-pane {
        z-index: 1; /* Keep map layer working smoothly in base memory */
        opacity: 1;
        pointer-events: auto;
      }

      /* --- Mobile Bottom Navigation Viewport Adjustments --- */
      @media only screen and (max-width: 992px) {
        .app-workspace {
          height: calc(100vh - var(--nav-height) - var(--bottom-nav-height));
        }
      }

      /* --- Mobile Bottom Nav Bar Styling --- */
      .bottom-nav-container {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        height: var(--bottom-nav-height);
        z-index: 1000;
        background-color: #ffffff;
        border-top: 1px solid var(--border-color);
      }
      .bottom-nav-container .tabs {
        height: 100%;
      }
      .bottom-nav-container .tabs .tab a {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        line-height: normal;
        height: 100%;
        padding-top: 4px;
        font-size: 0.75rem;
      }
      .bottom-nav-container .tabs .tab a i {
        margin-bottom: 2px;
        font-size: 1.5rem;
      }

      /* --- Custom Non-Blocking Full Overlay (Sits underneath Top Bar) --- */
      .results-overlay {
        position: fixed;
        top: var(--nav-height);
        left: 0;
        width: 100vw;
        height: calc(100vh - var(--nav-height));
        background-color: #ffffff;
        z-index: 2000;
        transform: translateY(100%);
        transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1);
        overflow-y: auto;
        padding: 24px;
      }
      .results-overlay.active {
        transform: translateY(0);
      }
      .close-overlay-btn {
        position: absolute;
        top: 16px;
        right: 16px;
      }

      .input-field {
        /* Turn off the default solid container fill color */
        --md-sys-color-surface-container-highest: transparent;
        --md-sys-color-on-surface-variant: var(--text-color); /* */
        
        /* Ensure the container doesn't force extra top padding meant for a label */
        padding-top: 0 !important;
        display: flex;
        align-items: center;
      }

      /* Let the input occupy the full height cleanly and center text vertically */
      .input-field input[type=text]#bus-search-input {
        background-color: transparent !important; /* */
        box-shadow: none !important; /* */
        height: 56px !important;    /* Standard comfortable MD3 touch target height */
        margin: 0 !important;
        padding-top: 0 !important;
        padding-bottom: 0 !important;
      }

      /* Center the search icon prefix perfectly with the vertical midpoint of the input */
      .input-field .prefix {
        top: 50% !important;
        transform: translateY(-50%);
        color: var(--text-color) !important; /* */
      }

      /* Adjust the padding on the input so the text doesn't crash into the centered icon */
      .input-field .prefix ~ input {
        margin-left: 3rem !important;
        width: calc(100% - 3rem) !important;
      }
    </style>

    <script src="static/stopdata.js"></script>

    <script type="module" src="src/search-engine.js"></script>

  </head>
  <body>

    <header>
      <nav>
        <div class="nav-wrapper">
            <a href="#" class="brand-logo center" style="font-family:Livvic;color:#000;font-size: 1.8rem;"><span class="material-icons">directions_bus</span> See Tow Bus</a>
        </div>
      </nav>
    </header>

    <main class="app-workspace">
      
      <section class="desktop-sidebar hide-on-med-and-down" id="sidebar-panel">
        <ul class="collection sidebar-nav-menu">
          <li class="collection-item active" data-target="map-pane">
            <i class="material-icons">map</i><span>Map View</span>
          </li>
          <li class="collection-item" data-target="search-pane">
            <i class="material-icons">search</i><span>Search Stops</span>
          </li>
          <li class="collection-item" data-target="fav-pane">
            <i class="material-icons">star</i><span>Saved Favourites</span>
          </li>
        </ul>
      </section>

      <section class="content-container">
        
        <div id="map-pane" class="view-pane active">
          <div style="padding:20px;"><h4>Map Canvas Base Layer</h4> <button 
  class="btn filled" 
  style="margin: 20px;" 
  onclick="window.showResultsOverlay()">
  <i class="material-icons left">bug_report</i> QA: Open Results Panel
</button></div>
        </div>

        <div id="search-pane" class="view-pane">
          <div class="row" style="padding: 20px;">
            
            <div class="input-field col s12 m8 offset-m2">
              <i class="material-icons prefix">search</i>
              <input type="text" id="bus-search-input" placeholder="Search stops by name or ID">
            </div>

            <div class="col s12 m8 offset-m2">
              <ul class="collection sidebar-nav-menu" id="search-results-list">
                </ul>
            </div>

          </div>
        </div>

        <div id="fav-pane" class="view-pane">
          <div style="padding:20px;"><h4>User Saved Favourites</h4></div>
        </div>

      </section>

    </main>

    <footer class="bottom-nav-container hide-on-large-only">
      <ul class="tabs tabs-fixed-width transparent" id="mobile-tabs-nav">
        <li class="tab">
          <a class="active" href="#map-pane">
            <i class="material-icons">map</i>
            <span>Map</span>
          </a>
        </li>
        <li class="tab">
          <a href="#search-pane">
            <i class="material-icons">search</i>
            <span>Search</span>
          </a>
        </li>
        <li class="tab">
          <a href="#fav-pane">
            <i class="material-icons">star</i>
            <span>Favourites</span>
          </a>
        </li>
      </ul>
    </footer>

    <div id="results-panel" class="results-overlay">
      <button class="btn-floating btn-flat waves-effect close-overlay-btn" id="close-results-btn">
        <i class="material-icons black-text">close</i>
      </button>
      <div class="container">
        <h4>Bus Arrival Timings</h4>
        <hr>
        <button class="btn" onclick="window.hideResultsOverlay()">Back to Navigation</button>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@materializecss/materialize@2.3.3/dist/js/materialize.min.js"></script>
    
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        // Targets for layout tracking
        const viewPanes = document.querySelectorAll('.view-pane');
        const sidebarItems = document.querySelectorAll('.sidebar-nav-menu .collection-item');
        const resultsPanel = document.getElementById('results-panel');
        const closeResultsBtn = document.getElementById('close-results-btn');

        // Global View Transition Coordinator
        window.switchAppView = (targetPaneId) => {
          viewPanes.forEach(pane => {
            if (pane.id === targetPaneId) {
              pane.classList.add('active');
            } else if (pane.id !== 'map-pane') {
              // Keep map pane structurally appended but drop visual layer
              pane.classList.remove('active');
            }
          });

          // Sync Desktop Sidebar UI elements status
          sidebarItems.forEach(item => {
            if (item.getAttribute('data-target') === targetPaneId) {
              item.classList.add('active');
            } else {
              item.classList.remove('active');
            }
          });

          // Sync Mobile Tabs UI elements status
          const tabInstance = M.Tabs.getInstance(document.getElementById('mobile-tabs-nav'));
          if (tabInstance) {
            tabInstance.select(targetPaneId);
          }
        };

        // Wire up Desktop Sidebar selection tracking
        sidebarItems.forEach(item => {
          item.addEventListener('click', () => {
            const target = item.getAttribute('data-target');
            window.switchAppView(target);
          });
        });

        // Initialize Materialize Mobile Navigation tabs configuration
        M.Tabs.init(document.getElementById('mobile-tabs-nav'), {
          onShow: (tabContentElement) => {
            // Trigger dynamic sync when mobile elements are swiped/tapped
            window.switchAppView(tabContentElement.id);
          }
        });

        // High-Performance Overlay Controls
        window.showResultsOverlay = () => { resultsPanel.classList.add('active'); };
        window.hideResultsOverlay = () => { resultsPanel.classList.remove('active'); };
        closeResultsBtn.addEventListener('click', window.hideResultsOverlay);

        // Global Auto-Initialization for leftover Materialize component triggers
        M.AutoInit();
      });
    </script>
  </body>
</html>
